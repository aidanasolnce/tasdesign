<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TasDesign — архив брендовых файлов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --ink:#15171C;
    --ink-2:#1C1F26;
    --paper:#ECE8DE;
    --line: rgba(236,232,222,0.14);
    --line-strong: rgba(236,232,222,0.26);
    --accent:#C98A3B;
    --accent-dim: rgba(201,138,59,0.16);
    --muted:#8B8D93;
    --danger:#C9633B;
    --tile:#3D4A5C;
    --tile-hover:#2E6BE0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Montserrat', sans-serif;
    min-height:100vh;
  }
  .display{
    font-family:'Montserrat', sans-serif;
    font-weight:700;
  }
  /* Top bar */
  header.topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:22px clamp(20px,4vw,48px);
    border-bottom:1px solid var(--line);
  }
  .mark{
    height:34px;
    width:auto;
    flex:none;
    display:block;
  }
  .brand{
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    font-size:19px;
    letter-spacing:0.01em;
  }
  .brand small{
    display:block;
    font-family:'Montserrat', sans-serif;
    font-weight:400;
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
    letter-spacing:0.03em;
  }

  main{
    max-width:920px;
    margin:0 auto;
    padding:clamp(28px,5vw,56px) clamp(20px,4vw,48px) 100px;
  }

  /* Breadcrumb / path */
  .path{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    font-size:13px;
    color:var(--muted);
    margin-bottom:34px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .path button{
    background:none;border:none;
    color:var(--muted);
    font-family:'Montserrat', sans-serif;
    font-size:13px;
    cursor:pointer;
    padding:2px 0;
  }
  .path button:hover, .path button:focus-visible{ color:var(--paper); }
  .path .current{ color:var(--paper); }
  .path .sep{ color: var(--line-strong); }

  .heading{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:20px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  h1.title{
    font-size:clamp(28px,4vw,40px);
    font-weight:500;
    margin:0;
    line-height:1.15;
  }
  .count{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
    padding-bottom:6px;
  }
  .sub{
    color:var(--muted);
    font-size:13.5px;
    margin:6px 0 30px;
    line-height:1.6;
  }

  /* Row list (folders or files) */
  ul.rows{
    list-style:none;
    margin:0;padding:0;
    border-top:1px solid var(--line);
  }
  ul.rows li{
    border-bottom:1px solid var(--line);
  }
  .row{
    width:100%;
    display:flex;
    align-items:center;
    gap:16px;
    padding:17px 4px;
    background:none;
    border:none;
    color:var(--paper);
    font-family:'Montserrat', sans-serif;
    font-size:14.5px;
    text-align:left;
    cursor:pointer;
  }
  .row:hover, .row:focus-visible{ color:var(--accent); outline:none; }
  .row .idx{
    color:var(--muted);
    font-size:12px;
    width:26px;
    flex:none;
  }
  .row .name{ flex:1; }
  .row .chev{
    color:var(--line-strong);
    font-size:15px;
    transition:transform .15s ease;
  }
  .row:hover .chev{ color:var(--accent); transform:translateX(3px); }

  /* Tile grid — для папок (категории и компании) */
  .tile-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    gap:14px;
  }
  .tile{
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    min-height:120px;
    padding:20px;
    background:var(--tile);
    border:none;
    border-radius:10px;
    color:var(--paper);
    font-family:'Montserrat', sans-serif;
    text-align:left;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .tile .tile-idx{
    font-size:11px;
    color:rgba(236,232,222,0.55);
    margin-bottom:10px;
    letter-spacing:0.04em;
  }
  .tile .tile-name{
    font-size:17px;
    font-weight:600;
    line-height:1.25;
  }
  .tile:hover, .tile:focus-visible{
    background:var(--tile-hover);
    transform:translateY(-2px);
    outline:none;
  }
  .tile:hover .tile-idx{ color:rgba(236,232,222,0.8); }

  /* File grid — конечная папка с файлами */
  .file-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));
    gap:14px;
  }
  .file-card{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .file-card .thumb{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
    background:#0F1116;
  }
  .file-card .thumb-placeholder{
    width:100%;
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0F1116;
    color:var(--muted);
    font-weight:700;
    font-size:13px;
    letter-spacing:0.03em;
  }
  .file-card .meta{
    padding:12px 13px 13px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .file-card .fname{
    font-size:12.5px;
    line-height:1.4;
    word-break:break-word;
    min-height:34px;
  }
  .file-card a.dl{
    display:block;
    text-align:center;
    color:var(--paper);
    text-decoration:none;
    font-size:12px;
    font-weight:600;
    background:var(--tile);
    padding:9px 10px;
    border-radius:6px;
    transition:background .15s ease;
  }
  .file-card a.dl:hover{ background:var(--tile-hover); }

  /* File row (fallback, не используется сейчас, оставлено для совместимости) */
  .filerow{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 4px;
  }
  .filerow .idx{ color:var(--muted); font-size:12px; width:26px; flex:none; }
  .filerow .name{ flex:1; font-size:14.5px; word-break:break-word; }
  .filerow .ext{
    font-size:11px;
    color:var(--ink);
    background:var(--accent);
    padding:2px 7px;
    letter-spacing:0.03em;
    flex:none;
  }
  .filerow a.dl{
    color:var(--muted);
    text-decoration:none;
    font-size:12.5px;
    border:1px solid var(--line-strong);
    padding:6px 12px;
    flex:none;
    white-space:nowrap;
  }
  .filerow a.dl:hover{ color:var(--paper); border-color:var(--paper); }

  /* Zip bar */
  .zipbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-top:26px;
    padding-top:22px;
    border-top:1px solid var(--line);
    flex-wrap:wrap;
  }
  .zipbar p{ margin:0; color:var(--muted); font-size:12.5px; }
  button.zipbtn{
    background:var(--accent);
    color:var(--ink);
    border:none;
    font-family:'Montserrat', sans-serif;
    font-weight:500;
    font-size:13px;
    padding:12px 20px;
    cursor:pointer;
    white-space:nowrap;
  }
  button.zipbtn:hover{ background:#DB9C52; }
  button.zipbtn:disabled{ opacity:.55; cursor:default; }

  /* States */
  .state{
    padding:60px 4px;
    color:var(--muted);
    font-size:13.5px;
    border-top:1px solid var(--line);
    line-height:1.7;
  }
  .state.error{ color:var(--danger); }
  .state code{
    background:var(--ink-2);
    padding:1px 6px;
    font-size:12.5px;
  }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:11.5px;
    padding:30px 20px 40px;
    letter-spacing:0.02em;
  }
</style>
</head>

<script>
/* ====================================================================

const API_KEY = "AIzaSyBnje5bGdd5bTwE3rY6kMF0UAi9CGlVHow";
const ROOT_FOLDER_ID = "1yq2JYvz5u3u3YOYXI9qY7oZvk40JcnC-";
/* ==================================================================== */

const FOLDER_MIME = "application/vnd.google-apps.folder";
const state = { stack: [{ id: ROOT_FOLDER_ID, name: "TASDesign" }] };

const els = {
  path: document.getElementById('path'),
  title: document.getElementById('title'),
  count: document.getElementById('count'),
  sub: document.getElementById('sub'),
  content: document.getElementById('content'),
};

function renderPath(){
  els.path.innerHTML = '';
  if (state.stack.length <= 1){
    els.path.style.display = 'none';
    return;
  }
  els.path.style.display = '';
  state.stack.forEach((node, i) => {
    if (i > 0){
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '/';
      els.path.appendChild(sep);
    }
    if (i === state.stack.length - 1){
      const span = document.createElement('span');
      span.className = 'current';
      span.textContent = node.name;
      els.path.appendChild(span);
    } else {
      const btn = document.createElement('button');
      btn.textContent = node.name;
      btn.onclick = () => { state.stack = state.stack.slice(0, i + 1); load(); };
      els.path.appendChild(btn);
    }
  });
}

async function driveList(folderId){
  const q = encodeURIComponent(`'${folderId}' in parents and trashed = false`);
  const fields = encodeURIComponent("files(id,name,mimeType,size)");
  const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&orderBy=folder,name&pageSize=200&key=${API_KEY}`;
  const res = await fetch(url);
  if (!res.ok){
    const body = await res.json().catch(() => ({}));
    throw new Error(body?.error?.message || `Drive API error (${res.status})`);
  }
  const data = await res.json();
  return data.files || [];
}

function fileExt(name){
  const parts = name.split('.');
  return parts.length > 1 ? parts.pop().toUpperCase() : '—';
}

function fileSize(bytes){
  if (!bytes) return '';
  const n = Number(bytes);
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
  return (n/1024/1024).toFixed(1) + ' MB';
}

async function load(){
  renderPath();
  const current = state.stack[state.stack.length - 1];
  const depth = state.stack.length; // 1 = root categories, 2 = companies, 3 = files

  els.title.textContent = current.name;
  els.count.textContent = '';
  els.sub.textContent = depth === 1
    ? 'Санатты таңдаңыз'
    : depth === 2
      ? 'Выберите компанию или филиал.'
      : 'Файлы для скачивания.';
  els.content.innerHTML = `<div class="state">Читаю папку…</div>`;

  let items;
  try{
    items = await driveList(current.id);
  } catch(err){
    els.content.innerHTML = `<div class="state error">Не удалось прочитать папку.<br>${err.message}<br><br>Проверьте, что API-ключ верный и папка открыта по ссылке (Читатель).</div>`;
    return;
  }

  if (depth < 3){
    // Показываем подпапки
    const folders = items.filter(f => f.mimeType === FOLDER_MIME);
    els.count.textContent = folders.length + (folders.length === 1 ? ' папка' : ' папок');
    if (folders.length === 0){
      els.content.innerHTML = `<div class="state">Эта папка пуста. Добавьте подпапки в Google Drive и обновите страницу.</div>`;
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'tile-grid';
    folders.forEach((f, i) => {
      const tile = document.createElement('button');
      tile.className = 'tile';
      tile.innerHTML = `<span class="tile-idx">${String(i+1).padStart(2,'0')}</span><span class="tile-name">${f.name}</span>`;
      tile.onclick = () => { state.stack.push({ id: f.id, name: f.name }); load(); };
      grid.appendChild(tile);
    });
    els.content.innerHTML = '';
    els.content.appendChild(grid);
  } else {
    // Показываем файлы конечной папки
    const files = items.filter(f => f.mimeType !== FOLDER_MIME);
    els.count.textContent = files.length + (files.length === 1 ? ' файл' : ' файлов');
    if (files.length === 0){
      els.content.innerHTML = `<div class="state">В этой папке пока нет файлов.</div>`;
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'file-grid';
    files.forEach((f) => {
      const card = document.createElement('div');
      card.className = 'file-card';
      const isImage = f.mimeType === 'image/jpeg' || f.mimeType === 'image/png';
      const visual = isImage
        ? `<img class="thumb" src="https://drive.google.com/thumbnail?id=${f.id}&sz=w400" alt="${f.name}" loading="lazy">`
        : `<div class="thumb-placeholder">${fileExt(f.name)}</div>`;
      card.innerHTML = `
        ${visual}
        <div class="meta">
          <span class="fname">${f.name}</span>
          <a class="dl" href="https://drive.google.com/uc?export=download&id=${f.id}" target="_blank" rel="noopener">Жүктеу</a>
        </div>`;
      grid.appendChild(card);
    });
    els.content.innerHTML = '';
    els.content.appendChild(grid);

    // Кнопка "скачать всё архивом"
    const zipbar = document.createElement('div');
    zipbar.className = 'zipbar';
    zipbar.innerHTML = `
      <p>Или получите все ${files.length} файлов одним архивом.</p>
      <button class="zipbtn" id="zipbtn">Скачать всё (.zip)</button>`;
    els.content.appendChild(zipbar);

    document.getElementById('zipbtn').onclick = async (e) => {
      const btn = e.target;
      btn.disabled = true;
      const originalText = btn.textContent;
      try{
        const zip = new JSZip();
        for (let i = 0; i < files.length; i++){
          btn.textContent = `Скачиваю ${i+1}/${files.length}…`;
          const f = files[i];
          const res = await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media&key=${API_KEY}`);
          if (!res.ok) throw new Error(`Не удалось скачать ${f.name}`);
          const blob = await res.blob();
          zip.file(f.name, blob);
        }
        btn.textContent = 'Собираю архив…';
        const content = await zip.generateAsync({ type: 'blob' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `${current.name}.zip`;
        link.click();
        btn.textContent = originalText;
      } catch(err){
        btn.textContent = 'Ошибка — попробуйте скачать файлы по отдельности';
      } finally {
        btn.disabled = false;
      }
    };
  }
}

load();
</script>
</body>
</html>
